{{- $h := index site.Data.heritage .Page.Language.Lang -}}
<figure class="heritage-family" aria-labelledby="language-family-caption">
  <figcaption id="language-family-caption">{{ $h.family_caption }}</figcaption>
  <ol>
    {{ range $h.family_entries }}<li><span>{{ .label }}</span><strong>{{ .title }}</strong>{{ if .note }}<small{{ with .note_lang }} lang="{{ . }}"{{ end }}>{{ .note }}</small>{{ end }}</li>{{ end }}
  </ol>
</figure>
