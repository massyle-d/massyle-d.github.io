{{- $h := index site.Data.heritage .Page.Language.Lang -}}
<figure class="heritage-timeline" aria-labelledby="numidia-timeline-caption">
  <figcaption id="numidia-timeline-caption">{{ $h.timeline_caption }}</figcaption>
  <ol>
    {{ range $h.timeline }}<li><p class="heritage-date">{{ .date | safeHTML }}</p><h3>{{ .title }}</h3><p>{{ .description }}</p></li>{{ end }}
  </ol>
  <p class="heritage-timeline-source">{{ $h.further_reading }} : <a href="https://www.livius.org/articles/person/massinissa/">{{ $h.livius_label }}</a>.</p>
</figure>
