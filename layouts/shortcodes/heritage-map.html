{{- $h := index site.Data.heritage .Page.Language.Lang -}}
<figure class="heritage-map" data-map-view="kabylie" aria-labelledby="heritage-map-title">
  <div class="heritage-map-heading"><div><p class="eyebrow">{{ $h.map_eyebrow }}</p><h2 id="heritage-map-title">{{ $h.map_heading }}</h2></div>
    <div class="heritage-map-controls" role="group" aria-label="{{ $h.map_controls }}" hidden><button type="button" data-map-choice="kabylie" aria-pressed="true">{{ $h.kabylie }}</button><button type="button" data-map-choice="massyles" aria-pressed="false">{{ $h.massyles }}</button></div>
  </div>
  {{ $map := resources.Get "images/heritage-map.svg" | resources.ExecuteAsTemplate (printf "images/heritage-map-%s.svg" .Page.Language.Lang) $h }}{{ $map.Content | safeHTML }}
  <figcaption>
    <p data-map-caption="kabylie"><span class="map-key" aria-hidden="true"></span><strong>{{ $h.kabylie_caption_title }}</strong> {{ $h.kabylie_caption }}</p>
    <p data-map-caption="massyles" hidden><span class="map-key ancient" aria-hidden="true"></span><strong>{{ $h.massyles_caption_title }}</strong> {{ $h.massyles_caption }}</p>
    <p class="map-credit">{{ $h.map_credit }} : <a href="https://www.naturalearthdata.com/about/terms-of-use/">Natural Earth</a> ({{ $h.public_domain }}). {{ $h.history_credit }} : <a href="{{ $h.massyles_wiki }}">{{ $h.massyles_reference }}</a> {{ if eq .Page.Language.Lang "en" }}and{{ else }}et{{ end }} <a href="https://journals.openedition.org/encyclopedieberbere/493">{{ $h.encyclopedia }}</a>.</p>
  </figcaption>
</figure>
