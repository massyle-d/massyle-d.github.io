<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="roots-map-title roots-map-desc">
<title id="roots-map-title">Kabylie et repères de la Numidie antique en Afrique du Nord</title>
<desc id="roots-map-desc">La Kabylie se situe dans le nord de l’Algérie, autour de Tizi Ouzou et Béjaïa. Dans l’Antiquité, les Massyles occupaient l’est de la Numidie, les Masaesyles l’ouest. Les limites antiques ne sont pas représentées. Cirta correspond à Constantine ; Carthage se situe près de Tunis.</desc>
